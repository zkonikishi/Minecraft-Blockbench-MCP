name: Check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    strategy:
      # A failure on one platform must not cancel the others; the whole point of the
      # matrix is to see every platform's result.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
        include:
          # Development machines run a newer line than either supported LTS; cover it
          # once so the matrix reflects what is actually used day to day.
          - os: ubuntu-latest
            node: 26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:upstream
      - run: npm audit --omit=dev --audit-level=moderate
      - run: node scripts/stage-release.mjs "${{ runner.temp }}/mcp-release-stage"
      - run: npm ci --omit=dev --ignore-scripts --prefix "${{ runner.temp }}/mcp-release-stage"
      - run: node scripts/verify-release.mjs "${{ runner.temp }}/mcp-release-stage"
      - uses: actions/upload-artifact@v4
        with:
          name: minecraft-blockbench-mcp-${{ matrix.os }}-node${{ matrix.node }}
          path: dist/
